[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-processual-lote"
version = "0.1.0"
description = "Organiza o texto de processos colado por uma pessoa, extrai por regra com evidência literal e monta planilha de análise. Não acessa sites de tribunal."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consulta_lote = ["templates/*.tpl"]
